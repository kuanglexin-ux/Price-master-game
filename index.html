<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商业估价大师 - 动态盲盒轮转版</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent-primary: #6366f1;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --blind-box-bg: linear-gradient(135deg, #1e1b4b 0%, #2e1065 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        header {
            background-color: rgba(30, 41, 59, 0.9);
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 800; color: #818cf8; letter-spacing: 1px; }
        .nav-btn { background-color: transparent; border: 1px solid var(--accent-primary); color: var(--text-main); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .nav-btn:hover { background-color: var(--accent-primary); }
        
        .container { flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; padding: 40px 20px; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .industry-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-top: 40px; }
        .industry-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; }
        .industry-card:hover { transform: translateY(-5px); border-color: var(--accent-primary); }
        .industry-icon { font-size: 48px; margin-bottom: 20px; }
        .industry-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .industry-desc { color: var(--text-muted); font-size: 14px; }

        .options-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        
        /* 盲盒状态样式 */
        .blind-box {
            background: var(--blind-box-bg);
            border: 2px dashed #818cf8;
            border-radius: 12px;
            height: 312px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .blind-box:hover {
            transform: scale(1.03);
            border-color: var(--accent-warning);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
        }
        .blind-box-question {
            font-size: 72px;
            font-weight: 900;
            color: var(--accent-warning);
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .blind-box-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
            background: rgba(0,0,0,0.2);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 揭晓后的产品卡片样式 */
        .product-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; height: 312px; display: flex; flex-direction: column; }
        .product-card:hover { transform: scale(1.03); border-color: var(--accent-primary); }
        .product-img-holder { width: 100%; height: 180px; background-color: #000; position: relative; }
        .product-img-holder img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; transition: 0.3s; }
        .product-card:hover .product-img-holder img { opacity: 1; }
        
        .tag-num { position:absolute; bottom:8px; left:8px; font-size:12px; background:rgba(0,0,0,0.7); color:white; padding:4px 8px; border-radius:4px; z-index: 10;}
        .product-card.revealed .tag-num { background-color: var(--accent-success); }

        .product-info { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--accent-primary); font-weight: 600; margin-bottom: 6px; }
        .product-city { background: rgba(99, 102, 241, 0.1); padding: 2px 6px; border-radius: 4px; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .product-shop { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
        .product-name { font-size: 15px; font-weight: 700; line-height: 1.4; height: 42px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        /* 主持人弹窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-container { background-color: var(--bg-card); width: 90%; max-width: 600px; border-radius: 16px; padding: 30px; }
        .modal-title { font-size: 22px; font-weight: 800; color: var(--accent-warning); text-align: center; }
        .modal-target-info { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 15px; margin: 20px 0; border-left: 4px solid var(--accent-primary); }
        .input-price { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; font-size: 18px; margin-top: 10px; }
        .modal-actions { display: flex; gap: 15px; margin-top: 25px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; border: none; font-weight: bold;}
        .btn-secondary { background-color: #475569; color: white; }
        .btn-primary { background-color: var(--accent-primary); color: white; }
        .reveal-box { display: none; text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border-color); }
        .price-big { font-size: 36px; font-weight: 900; color: var(--accent-success); margin: 10px 0; }
        
        /* 状态提示 */
        .status-badge {
            position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6); 
            padding: 8px 12px; border-radius: 20px; font-size: 12px; color: var(--text-muted);
            border: 1px solid var(--border-color); z-index: 900;
        }
    </style>
</head>

        let scrambledCurrentItems = [];

        let shiftCount = parseInt(sessionStorage.getItem('blindBoxShiftCount') || '0');
        
        if (sessionStorage.getItem('isInitialized')) {
            shiftCount += 1;
            sessionStorage.setItem('blindBoxShiftCount', shiftCount);
        } else {
            sessionStorage.setItem('isInitialized', 'true');
            sessionStorage.setItem('blindBoxShiftCount', '0');
        }
        
        document.getElementById('shiftStatusInfo').innerText = `当前盲盒推演轮数: ${shiftCount}`;

        function applyDynamicPermutation(originalItems) {
            if (!originalItems || originalItems.length < 8) return originalItems;
            
            let items = [...originalItems];
            
            for(let step = 0; step < shiftCount; step++) {
                let nextRound = new Array(8);
                nextRound[6] = items[0];
                nextRound[5] = items[1];
                nextRound[4] = items[2];
                nextRound[0] = items[3];
                nextRound[7] = items[4];
                nextRound[1] = items[5];
                nextRound[3] = items[6];
                nextRound[2] = items[7];
                
                items = nextRound;
            }
            return items;
        }

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.getElementById('backToIndustryBtn').style.display = viewId === 'options-view' ? 'block' : 'none';
        }

        function enterIndustry(industryKey) {
            const industryData = gameData[industryKey];
            if(!industryData) { alert("此行业暂无数据，请检查 Excel 转换是否成功！"); return; }
            
            document.getElementById('current-industry-title').innerText = industryData.title;
            scrambledCurrentItems = applyDynamicPermutation(industryData.items);
            
            renderGrid();
            showView('options-view');
        }

        function renderGrid() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            scrambledCurrentItems.forEach((item, index) => {
                const boxNumber = index + 1;
                const isOpened = openedItems.has(item.id);
                const isRevealed = revealedItems.has(item.id);

                const cardWrapper = document.createElement('div');

                if (!isOpened) {
                    cardWrapper.className = "blind-box";
                    cardWrapper.onclick = () => openBlindBox(item.id);
                    cardWrapper.innerHTML = `
                        <div class="blind-box-question">?</div>
                        <div class="blind-box-title">盲盒 0${boxNumber}</div>
                    `;
                } else {
                    cardWrapper.className = `product-card ${isRevealed ? 'revealed' : ''}`;
                    cardWrapper.onclick = () => selectProduct(item);

                    let imgHtml = item.image ? 
                        `<img src="${item.image}" alt="产品图">` : 
                        `<div style="color:#666; padding-top:70px; text-align:center;">暂无图片</div>`;

                    cardWrapper.innerHTML = `
                        <div class="product-img-holder">
                            ${imgHtml}
                            <div class="tag-num">${isRevealed ? '已揭晓价格' : '盲盒 0' + boxNumber + ' · 已解锁'}</div>
                        </div>
                        <div class="product-info">
                            <div class="product-meta">
                                <span class="product-shop">${item.shop}</span>
                                <span class="product-city">${item.city}</span>
                            </div>
                            <div class="product-name">${item.product}</div>
                        </div>
                    `;
                }
                container.appendChild(cardWrapper);
            });
        }

        function openBlindBox(itemId) {
            openedItems.add(itemId);
            renderGrid();
        }

        function selectProduct(item) {
            currentSelectedItem = item;
            document.getElementById('modalTargetDetails').innerHTML = `
                <div style="font-size: 14px; margin-bottom: 5px;"><strong>品牌：</strong>${item.shop} | <strong>来源：</strong>${item.city}</div>
                <div style="font-size: 18px; font-weight: 700; color: #fff;">${item.product}</div>
            `;
            document.getElementById('playerBid').value = '';
            document.getElementById('revealBox').style.display = 'none';
            document.getElementById('initialActions').style.display = 'flex';
            document.getElementById('hostModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('hostModal').classList.remove('active');
            currentSelectedItem = null;
        }

        function confirmAndReveal() {
            if (!currentSelectedItem) return;
            const playerBidVal = parseFloat(document.getElementById('playerBid').value);
            if (isNaN(playerBidVal)) { alert('请输入选手的实际报价！'); return; }

            const realPrice = currentSelectedItem.price;
            
            // 计算偏差百分比，并保留 2 位小数
            const diff = Math.abs(playerBidVal - realPrice);
            const percentageDiff = realPrice > 0 ? ((diff / realPrice) * 100).toFixed(2) : '0.00';
            
            document.getElementById('realPriceVal').innerText = realPrice.toFixed(2);
            document.getElementById('resultAnalysisText').innerHTML = `
                <div>选手最终报价：<strong>¥ ${playerBidVal.toFixed(2)}</strong></div>
                <div style="margin-top: 10px; font-size: 16px;">价格偏差比例：<span style="color: var(--accent-warning);">${percentageDiff}%</span></div>
            `;
            
            revealedItems.add(currentSelectedItem.id);
            renderGrid();

            document.getElementById('initialActions').style.display = 'none';
            document.getElementById('revealBox').style.display = 'block';
        }
    </script>
</body>
</html>
